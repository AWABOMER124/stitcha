version: 2
updates:
  - package-ecosystem: npm
    directory: /merchant-os
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      merchant-os-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      flutter-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
