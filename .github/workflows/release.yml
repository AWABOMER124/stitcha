name: Build verified release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-build
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  image:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require explicitly configured private image storage
        env:
          REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          IMAGE: ${{ vars.RELEASE_IMAGE }}
          PRIVATE_CONFIRMED: ${{ vars.PRIVATE_REGISTRY_CONFIRMED }}
          ACTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          test "$PRIVATE_CONFIRMED" = true
          test -n "$REGISTRY" && test -n "$IMAGE" && test -n "$REGISTRY_TOKEN"
          test -n "$ACTION_KEY"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ vars.RELEASE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build once and publish only to the configured private registry
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ vars.RELEASE_IMAGE }}:release-${{ github.sha }}
          build-args: |
            APP_RELEASE=git-${{ github.sha }}
            NEXT_PUBLIC_APP_URL=https://wassla-sd.shop
          secrets: |
            next_server_actions_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
      - name: Record the immutable image to be staged and promoted
        env:
          IMAGE: ${{ vars.RELEASE_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'No production deployment is performed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
