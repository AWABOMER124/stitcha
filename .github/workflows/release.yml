name: Build verified release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-build
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  image:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build the protected production image without publishing plaintext
        env:
          ACTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          test -n "$ACTION_KEY"
          docker buildx build --load --platform linux/amd64 \
            --file Dockerfile --tag "wasla-platform:git-$GITHUB_SHA" \
            --build-arg "APP_RELEASE=git-$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_APP_URL=https://wassla-sd.shop \
            --secret id=next_server_actions_key,env=ACTION_KEY .
      - name: Encrypt delivery to the production server public key
        run: bash ops/releases/export_encrypted_image.sh "wasla-platform:git-$GITHUB_SHA" "git-$GITHUB_SHA" "$RUNNER_TEMP/wasla-release"
      - name: Upload only encrypted image and non-secret provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasla-production-image
          path: ${{ runner.temp }}/wasla-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Record delivery identity
        run: |
          cat "$RUNNER_TEMP/wasla-release/release.json" >> "$GITHUB_STEP_SUMMARY"
          printf '\n%s\n' 'Image is encrypted to the production server; no automatic production deployment.' >> "$GITHUB_STEP_SUMMARY"
