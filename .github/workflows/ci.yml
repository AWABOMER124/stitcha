name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merchant-os:
    name: Merchant OS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merchant-os
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stitcha_ci
      AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: merchant-os/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true
      - name: Install dependencies from lockfile
        run: flutter pub get --enforce-lockfile
      - name: Reject hard-coded Google Maps keys
        run: |
          if grep -R -E "AIza[0-9A-Za-z_-]{20,}" android/app/src ios/Runner/AppDelegate.swift; then
            echo "Hard-coded Google Maps API key detected."
            exit 1
          fi
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
