name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merchant-os:
    name: Merchant OS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stitcha_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stitcha_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: merchant-os
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stitcha_ci
      AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: merchant-os/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test database-backed order lifecycle
        run: npm run test:integration
      - name: Build
        run: npm run build

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true
      - name: Install dependencies from lockfile
        run: flutter pub get --enforce-lockfile
      - name: Reject hard-coded Google Maps keys
        run: |
          if grep -R -E "AIza[0-9A-Za-z_-]{20,}" android/app/src ios/Runner/AppDelegate.swift; then
            echo "Hard-coded Google Maps API key detected."
            exit 1
          fi
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  production-container:
    name: Production container
    runs-on: ubuntu-latest
    needs: merchant-os
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stitcha_container_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stitcha_container_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build Dokploy image from repository root
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000
          --tag wasla-merchant-os:ci .
      - name: Start production container
        run: >-
          docker run --detach --name wasla-container-ci --network host
          --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/stitcha_container_ci
          --env AUTH_SECRET=ci-only-secret-with-at-least-32-characters
          --env AUTH_TRUST_HOST=true
          --env NEXTAUTH_URL=http://localhost:3000
          --env NEXT_PUBLIC_APP_URL=http://localhost:3000
          --env SECRETS_ENCRYPTION_KEY=ci-only-encryption-secret-value
          wasla-merchant-os:ci
      - name: Verify migrations and health endpoint
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' wasla-container-ci)" != "true" ]; then
              docker logs wasla-container-ci
              exit 1
            fi
            sleep 2
          done
          docker logs wasla-container-ci
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker logs wasla-container-ci
      - name: Stop production container
        if: always()
        run: docker rm --force wasla-container-ci
